; Presets de exportación de RPG Mapping (Godot 4.7.2).
; include_filter="*.json": sin él, los perfiles de data/systems/*.json no
; entran en la build (Godot solo exporta recursos que conoce).
; Los tests y GUT se excluyen de las builds normales; el preset
; "Web Tests" los incluye para ejecutar la batería en el navegador
; (criterio de aceptación de F0).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, export_icons/*.png, export_icons/*.icns"
export_path="../build/win/RPGMapping.exe"

[preset.0.options]

binary_format/embed_pck=true
application/icon="res://export_icons/app.ico"
application/product_name="RPG Mapping"
application/file_description="RPG Mapping"
application/file_version="0.0.1.0"
application/product_version="0.0.1.0"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, export_icons/*"
export_path="../build/linux/RPGMapping.x86_64"

[preset.1.options]

binary_format/embed_pck=true

[preset.2]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, export_icons/*.png, export_icons/*.ico"
export_path="../build/mac/RPGMapping.zip"

[preset.2.options]

application/icon="res://export_icons/app.icns"
application/bundle_identifier="io.github.rpgmapping.app"
application/short_version="0.0.1"
application/version="0.0.1"

[preset.3]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, export_icons/*.ico, export_icons/*.icns"
export_path="../build/web/index.html"

[preset.3.options]

variant/thread_support=false
html/export_icon=true
progressive_web_app/enabled=false
progressive_web_app/icon_144x144="res://export_icons/icon-192.png"
progressive_web_app/icon_180x180="res://export_icons/icon-192.png"
progressive_web_app/icon_512x512="res://export_icons/icon-512.png"

[preset.4]

name="Web Tests"
platform="Web"
runnable=false
dedicated_server=false
custom_features="web_tests"
; Scripts como texto: GUT lee el código fuente (dobles, stubs, parser).
script_export_mode=0
export_filter="all_resources"
include_filter="*.json, *.cfg, *.txt"
exclude_filter="export_icons/*"
export_path="../build/web-tests/index.html"

[preset.4.options]

variant/thread_support=false
html/export_icon=false
progressive_web_app/enabled=false
