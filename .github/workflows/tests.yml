# Tests headless con GUT (PROYECTO.md §3, CI).
# Pendiente: exportación de las 4 plataformas y seeds doradas en la build web.
name: tests

on:
  push:
    # Un cambio solo de documentación no toca lo que se prueba.
    paths-ignore: ['**/*.md', 'assets/icon/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'assets/icon/**', 'LICENSE']

# Varios pushes seguidos: solo cuenta el último (menos ejecuciones y correos).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  unit:
    runs-on: ubuntu-latest
    # Unos 2-3 min; sin límite, un bloqueo gastaría las 6 h por defecto.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Descargar Godot ${{ env.GODOT_VERSION }}
        run: |
          set -eu
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "$base/$file.zip"
          unzip -q godot.zip
          chmod +x "$file"
          echo "GODOT=$PWD/$file" >> "$GITHUB_ENV"

      - name: Tests
        run: sh tools/run_tests.sh
